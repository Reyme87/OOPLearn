services:
  postgres:
    image: postgres:17-alpine
    container_name: ooplearn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  lesson-service:
    build:
      context: .
      dockerfile: OOPLearn.Backend/LessonService/LessonServiceApp/Dockerfile
    container_name: ooplearn-lesson-service
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=lesson_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy

  task-service:
    build:
      context: .
      dockerfile: OOPLearn.Backend/TaskService/TaskServiceApp/Dockerfile
    container_name: ooplearn-task-service
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=task_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    build:
      context: .
      dockerfile: OOPLearn.Backend/AuthService/AuthServiceApp/Dockerfile
    container_name: ooplearn-auth-service
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=auth_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: ApiGateway/Dockerfile
    container_name: ooplearn-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      GrpcServices__Lesson: http://lesson-service:5290
      GrpcServices__Task: http://task-service:5059
      GrpcServices__Auth: http://auth-service:5060
    depends_on:
      - lesson-service
      - task-service
      - auth-service

  frontend:
    build:
      context: ./OOPLearn.Frontend/OOPLearn.WebUI
      dockerfile: Dockerfile
    container_name: ooplearn-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
      
volumes:
  postgres_data: